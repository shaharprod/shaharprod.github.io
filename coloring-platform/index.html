<!-- כתובת ישנה שמופיעה בקוד ה-QR של פרק 1. מעבירה לאתר הצביעה החדש, לפרק ולשפה הנכונים. -->
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var ep=parseInt(q.get('ep')||q.get('e'),10); if(!(ep>=1&&ep<=12)) ep=1;
  var l=q.get('lang'); if(l!=='he'&&l!=='en'){ l=/^he|^iw/i.test(navigator.language||'')?'he':'en'; }
  location.replace('https://shaharprod.github.io/sandy-and-danny/?e='+ep+'&lang='+l);
})();
</script>
